<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio y video</title>
    <!-- Fuentes-->
    <link href="https://fonts.googleapis.com/css2?family=Clarity+City:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <!-- CSS de proyecto-->
    <link rel="stylesheet" href="../css/video.css">
</head>
<body>
    <header>
        <h1>Audio y Video HTML</h1>
    </header>

    <section class="audio container">
        <h2>Audio HTML</h2>
        <div>
            <audio src="../assets/sonido.mp3" controls muted>Your browser does not support the audio element.</audio>
            
        </div>
    </section>

    <section class="video container">
        <h3>Video HTML</h3>
        <div class="items">
            <video src="../assets/soyfrankelda.mp4" controls></video>


        </div>
        <div class="items">
            <iframe src="https://www.youtube.com/embed/ym7YMDRY7wU?si=HDFKbpiX7VoovksC" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

        </div>
    </section>

<footer class="pie">
    <p>Copyrights 2026</p>
</footer>

</body>
</html>
